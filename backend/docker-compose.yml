services:
  mongodb:
    image: mongo:7
    command: ['mongod', '--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '127.0.0.1:${MONGODB_PORT:-27017}:27017'
    volumes:
      - vegan_support_mongodb:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'quit(db.hello().isWritablePrimary ? 0 : 1)']
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  mongo-init:
    image: mongo:7
    depends_on:
      mongodb:
        condition: service_started
    entrypoint: ['bash', '-c']
    command:
      - |
        for attempt in {1..60}; do
          if mongosh --host mongodb --quiet --eval 'db.adminCommand({ping:1})' >/dev/null 2>&1; then
            mongosh --host mongodb --quiet --eval 'try { rs.status() } catch (error) { if (error.code !== 94) throw error; rs.initiate({_id:"rs0",members:[{_id:0,host:"mongodb:27017"}]}) }'
            exit 0
          fi
          sleep 1
        done
        exit 1
    restart: 'no'

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: mongodb://mongodb:27017/${MONGODB_DATABASE:-vegan_support}?replicaSet=rs0&directConnection=true
      RUN_SEED: ${RUN_SEED:-true}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      SHUTDOWN_TIMEOUT_MS: ${SHUTDOWN_TIMEOUT_MS:-10000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-development-secret-change-me-32-chars}
      JWT_ISSUER: ${JWT_ISSUER:-vegan-support-api}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-vegan-support-web}
      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-30}
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-5}
      LOGIN_LOCK_MINUTES: ${LOGIN_LOCK_MINUTES:-15}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-local-development}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-local-development}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-local-development}
      CLOUDINARY_UPLOAD_FOLDER: ${CLOUDINARY_UPLOAD_FOLDER:-vegan-support/posts}
      MAX_UPLOAD_IMAGE_BYTES: ${MAX_UPLOAD_IMAGE_BYTES:-10000000}
      MAX_UPLOAD_VIDEO_BYTES: ${MAX_UPLOAD_VIDEO_BYTES:-100000000}
      STORAGE_DEFAULT_QUOTA_BYTES: ${STORAGE_DEFAULT_QUOTA_BYTES:-1073741824}
      UPLOAD_RESERVATION_TTL_SECONDS: ${UPLOAD_RESERVATION_TTL_SECONDS:-900}
      CLOUDINARY_API_TIMEOUT_MS: ${CLOUDINARY_API_TIMEOUT_MS:-10000}
      AI_CHAT_ENABLED: ${AI_CHAT_ENABLED:-true}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-gpt-5.6-terra}
      AI_MODEL_MODERATION: ${AI_MODEL_MODERATION:-omni-moderation-latest}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-30000}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-800}
      AI_GUEST_DAILY_QUOTA: ${AI_GUEST_DAILY_QUOTA:-5}
      AI_MEMBER_DAILY_QUOTA: ${AI_MEMBER_DAILY_QUOTA:-20}
      AI_PRIVILEGED_DAILY_QUOTA: ${AI_PRIVILEGED_DAILY_QUOTA:-50}
      AI_GUEST_RATE_LIMIT_PER_MINUTE: ${AI_GUEST_RATE_LIMIT_PER_MINUTE:-10}
      CHAT_GUEST_COOKIE_SECRET: ${CHAT_GUEST_COOKIE_SECRET:-local-chat-guest-secret-change-me-32-chars}
      CHAT_GUEST_COOKIE_TTL_DAYS: ${CHAT_GUEST_COOKIE_TTL_DAYS:-7}
      VISION_ENABLED: ${VISION_ENABLED:-false}
      VISION_PROVIDER: ${VISION_PROVIDER:-openai}
      VISION_MODEL: ${VISION_MODEL:-}
      VISION_TEMPLATE_VERSION: ${VISION_TEMPLATE_VERSION:-fridge-v1}
      VISION_MAX_OUTPUT_TOKENS: ${VISION_MAX_OUTPUT_TOKENS:-2048}
      VISION_MAX_IMAGES: ${VISION_MAX_IMAGES:-6}
      VISION_MAX_IMAGE_BYTES: ${VISION_MAX_IMAGE_BYTES:-10000000}
      RECEIPT_ENABLED: ${RECEIPT_ENABLED:-false}
      RECEIPT_PROVIDER: ${RECEIPT_PROVIDER:-openai}
      RECEIPT_MODEL: ${RECEIPT_MODEL:-}
      RECEIPT_TEMPLATE_VERSION: ${RECEIPT_TEMPLATE_VERSION:-receipt-v3}
      AI_RECIPE_ENABLED: ${AI_RECIPE_ENABLED:-true}
      AI_RECIPE_MODEL: ${AI_RECIPE_MODEL:-}
      AI_RECIPE_TEMPLATE_VERSION: ${AI_RECIPE_TEMPLATE_VERSION:-recipe-draft-v1}
      AI_RECIPE_MAX_OUTPUT_TOKENS: ${AI_RECIPE_MAX_OUTPUT_TOKENS:-4096}
      RECEIPT_MAX_OUTPUT_TOKENS: ${RECEIPT_MAX_OUTPUT_TOKENS:-4096}
      RECEIPT_MAX_IMAGES: ${RECEIPT_MAX_IMAGES:-4}
      RECEIPT_MAX_IMAGE_BYTES: ${RECEIPT_MAX_IMAGE_BYTES:-10000000}
      MAPS_PROVIDER: ${MAPS_PROVIDER:-fake}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      SERPAPI_API_KEY: ${SERPAPI_API_KEY:-}
      SERPAPI_BASE_URL: ${SERPAPI_BASE_URL:-https://serpapi.com/search.json}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-payos}
      BILLING_PUBLIC_URL: ${BILLING_PUBLIC_URL:-http://localhost:4000}
      BILLING_RETURN_URL: ${BILLING_RETURN_URL:-http://localhost:3000/billing}
      PAYOS_CLIENT_ID: ${PAYOS_CLIENT_ID:-}
      PAYOS_API_KEY: ${PAYOS_API_KEY:-}
      PAYOS_CHECKSUM_KEY: ${PAYOS_CHECKSUM_KEY:-}
      BILLING_ORDER_TTL_MINUTES: ${BILLING_ORDER_TTL_MINUTES:-15}
      BILLING_PANTRY_BASE_LIMIT: ${BILLING_PANTRY_BASE_LIMIT:-20}
      BILLING_FRIDGE_TRIAL_JOBS: ${BILLING_FRIDGE_TRIAL_JOBS:-3}
      BILLING_RECEIPT_TRIAL_JOBS: ${BILLING_RECEIPT_TRIAL_JOBS:-3}
      BILLING_SCAN_MAX_ATTEMPTS: ${BILLING_SCAN_MAX_ATTEMPTS:-3}
      BILLING_USAGE_LEASE_SECONDS: ${BILLING_USAGE_LEASE_SECONDS:-1800}
      SEED_MEMBER_EMAIL: ${SEED_MEMBER_EMAIL:-member@example.com}
      SEED_MEMBER_PASSWORD: ${SEED_MEMBER_PASSWORD}
      SEED_PLATFORM_CONTRIBUTOR_EMAIL: ${SEED_PLATFORM_CONTRIBUTOR_EMAIL:-contributor@example.com}
      SEED_ORGANIZATION_CONTRIBUTOR_EMAIL: ${SEED_ORGANIZATION_CONTRIBUTOR_EMAIL:-expert@example.com}
      SEED_INVITED_CONTRIBUTOR_EMAIL: ${SEED_INVITED_CONTRIBUTOR_EMAIL:-invited@example.com}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@example.com}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
    ports:
      - '${BACKEND_PORT:-4000}:4000'
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:3
    profiles: ['webhook']
    command:
      - http
      - ${NGROK_UPSTREAM:-http://backend:4000}
      - --url=${NGROK_URL:-}
      - --config=/etc/ngrok.yml
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:-}
    volumes:
      - ./ngrok.yml:/etc/ngrok.yml:ro
    ports:
      - '127.0.0.1:${NGROK_INSPECTOR_PORT:-4040}:4040'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  vegan_support_mongodb:
    name: ${MONGODB_VOLUME_NAME:-vegan_support_mongodb}
