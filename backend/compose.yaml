services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vegan_support
      POSTGRES_USER: vegan
      POSTGRES_PASSWORD: vegan_local
    ports:
      - '5432:5432'
    volumes:
      - vegan_support_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vegan -d vegan_support']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vegan_support_postgres:
